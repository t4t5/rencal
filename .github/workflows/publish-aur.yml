name: Publish to AUR

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]

jobs:
  publish_aur_bin:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Get version from latest GitHub release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release view --repo t4t5/rencal --json tagName -q .tagName)
          version="${tag#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing rencal-bin ${version} to AUR"

      - name: Generate PKGBUILD
        run: |
          sed "s/VERSION_PLACEHOLDER/${{ steps.version.outputs.version }}/" \
              aur/PKGBUILD-bin.template > PKGBUILD

      - name: Fill in per-architecture checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # updpkgsums only regenerates the sums for the runner's own CARCH, which
          # would leave sha256sums_aarch64 as SKIP. Hash both release debs instead.
          tmp="$(mktemp -d)"
          gh release download "v${VERSION}" --repo t4t5/rencal --dir "$tmp" \
            --pattern "renCal_${VERSION}_amd64.deb" \
            --pattern "renCal_${VERSION}_arm64.deb"
          amd64_sum="$(sha256sum "$tmp/renCal_${VERSION}_amd64.deb" | cut -d ' ' -f 1)"
          arm64_sum="$(sha256sum "$tmp/renCal_${VERSION}_arm64.deb" | cut -d ' ' -f 1)"
          sed -i \
            -e "s/^sha256sums_x86_64=('SKIP')/sha256sums_x86_64=('${amd64_sum}')/" \
            -e "s/^sha256sums_aarch64=('SKIP')/sha256sums_aarch64=('${arm64_sum}')/" \
            PKGBUILD
          if grep -q SKIP PKGBUILD; then
            echo "A checksum was left as SKIP" >&2
            exit 1
          fi
          cat PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: rencal-bin
          pkgbuild: ./PKGBUILD
          commit_username: ${{ vars.AUR_USERNAME }}
          commit_email: ${{ vars.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ steps.version.outputs.version }}"
