name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - run: nix flake check --no-build

  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.runner }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Create provider placeholders
        run: |
          mkdir -p src-tauri/providers
          for provider in google icloud outlook caldav webcal; do
            touch "src-tauri/providers/caldir-provider-${provider}"
            chmod +x "src-tauri/providers/caldir-provider-${provider}"
          done

      - name: Run checks
        run: just check

      - name: Run tests
        run: just test

  linux-packaging:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libarchive-tools \
            patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: linux-packaging

      - run: pnpm install --frozen-lockfile
      - run: scripts/install-caldir-providers.sh
      - run: cargo build --release --manifest-path src-tauri/Cargo.toml -p rencal-notifierd

      - name: Build Linux packages
        env:
          NO_STRIP: "true"
        run: |
          pnpm tauri build --bundles appimage,deb,rpm --config '{ "bundle": { "createUpdaterArtifacts": false } }'

      - name: Check bundled providers
        run: scripts/check-bundled-providers.sh
