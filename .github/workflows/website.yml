name: Deploy website

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      plugin_index_artifact:
        description: Artifact containing a freshly generated plugins.json
        required: false
        type: string
        default: ""

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Preserve deployed plugin index
        shell: bash
        run: |
          if curl --fail --silent --show-error https://rencal.org/plugins.json --output /tmp/rencal-plugins.json; then
            mv /tmp/rencal-plugins.json website/public/plugins.json
          fi

      - name: Download fresh plugin index
        if: ${{ inputs.plugin_index_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.plugin_index_artifact }}
          path: website/public

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: website

      - name: Build
        run: pnpm build
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: pages deploy dist/ --project-name=rencal --branch=${{ github.ref_name }}
