name: Index plugins

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: plugin-index
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: plugin-indexer

      - name: Build plugin index
        run: cargo run --manifest-path src-tauri/Cargo.toml -p rencal-plugin-indexer -- website/public/plugins.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload plugin index
        uses: actions/upload-artifact@v4
        with:
          name: plugin-index
          path: website/public/plugins.json
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: index
    uses: ./.github/workflows/website.yml
    with:
      plugin_index_artifact: plugin-index
    secrets: inherit
